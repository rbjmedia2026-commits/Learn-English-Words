<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Five a Day: learn five English words a day.
  Open source under the MIT License (see LICENSE). Copyright (c) 2026 RBJ Media.
  Everything is in this one file. The built-in word list is the WORDS_RAW array near the bottom.
  Runs in any modern browser with no account or server. Progress is saved in the browser (localStorage).
  "Fresh online" words come from the free Datamuse API and Free Dictionary API; without internet the built-in list is used.
  Code that mentions window.claude is optional: it only turns on account saving, Claude-written words, downloads and the Claude voice when the page is opened inside Claude.
-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five a Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one phone-first column (max 520px). The yellow letter tiles are the only loud element; everything else stays quiet. */
  --paper: #F1F3FA;
  --card: #FFFFFF;
  --ink: #141A3A;
  --muted: #5A6386;
  --line: #D8DDEE;
  --cobalt: #2B44E8;
  --cobalt-deep: #1A2DB0;
  --cobalt-ink: #FFFFFF;
  --cobalt-soft: #E2E6FF;
  --tile: #FFC83D;
  --tile-edge: #D69600;
  --tile-ink: #1F1A0C;
  --good: #11804A;
  --good-soft: #DDF4E5;
  --bad: #CC3337;
  --bad-soft: #FCE4E4;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C1130;
    --card: #161C46;
    --ink: #EEF0FF;
    --muted: #A2A9D2;
    --line: #2B3368;
    --cobalt: #8E9BFF;
    --cobalt-deep: #5F6FE6;
    --cobalt-ink: #0C1130;
    --cobalt-soft: #232B68;
    --tile: #FFC83D;
    --tile-edge: #B07B00;
    --tile-ink: #1F1A0C;
    --good: #52D08E;
    --good-soft: #10392A;
    --bad: #FF7B7E;
    --bad-soft: #47192A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C1130;
  --card: #161C46;
  --ink: #EEF0FF;
  --muted: #A2A9D2;
  --line: #2B3368;
  --cobalt: #8E9BFF;
  --cobalt-deep: #5F6FE6;
  --cobalt-ink: #0C1130;
  --cobalt-soft: #232B68;
  --tile: #FFC83D;
  --tile-edge: #B07B00;
  --tile-ink: #1F1A0C;
  --good: #52D08E;
  --good-soft: #10392A;
  --bad: #FF7B7E;
  --bad-soft: #47192A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.wrap { max-width: 520px; margin: 0 auto; padding: 16px 20px 120px; display: flex; flex-direction: column; gap: 28px; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 22px; letter-spacing: -0.01em; }
.brand .tile { --t: 30px; font-size: 18px; }
.top-right { display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums; }
.pill svg { width: 18px; height: 18px; }
.flame { color: #F26B1D; }
.pill.cold .flame { color: var(--muted); }
.icon-btn { width: 38px; height: 38px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- tiles ---------- */
.tiles { display: flex; flex-wrap: wrap; gap: 10px 14px; }
.tg { display: inline-flex; flex-wrap: wrap; gap: calc(var(--t) * 0.12); align-items: center; }
.tile {
  --t: 44px;
  width: var(--t); height: calc(var(--t) * 1.1);
  display: inline-grid; place-items: center;
  background: var(--tile); color: var(--tile-ink);
  border-radius: calc(var(--t) * 0.18);
  box-shadow: 0 calc(var(--t) * 0.09) 0 var(--tile-edge), inset 0 -2px 0 rgba(255,255,255,.25);
  font-family: var(--font-body); font-weight: 700;
  font-size: calc(var(--t) * 0.6); line-height: 1;
  user-select: none;
}
.tj { font-weight: 700; font-size: calc(var(--t) * 0.6); color: var(--muted); }
.tile.down {
  background: var(--cobalt) radial-gradient(circle at 50% 50%, rgba(255,255,255,.18) 1.5px, transparent 2px) 0 0 / 8px 8px;
  color: var(--cobalt-ink); box-shadow: 0 calc(var(--t) * 0.09) 0 var(--cobalt-deep);
  font-family: var(--font-display); font-weight: 400;
}
.pop { animation: flipIn .45s cubic-bezier(.2,.9,.3,1.3) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes flipIn { from { transform: rotateX(90deg) translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- type ---------- */
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.h-xl { font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: 1.08; letter-spacing: -0.015em; }
.h-l { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.15; }
.sub { color: var(--muted); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 54px; padding: 12px 20px; width: 100%;
  border-radius: var(--r); border: 0;
  background: var(--cobalt); color: var(--cobalt-ink);
  font-weight: 700; font-size: 18px;
  box-shadow: 0 4px 0 var(--cobalt-deep);
  transition: transform .08s, box-shadow .08s;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--cobalt-deep); }
.btn.alt { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn.alt:active:not(:disabled) { box-shadow: 0 1px 0 var(--line); }
.btn.ok { background: var(--good); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--good) 70%, #000); }
.btn.no { background: var(--bad); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--bad) 70%, #000); }
:root[data-theme="dark"] .btn.ok, :root[data-theme="dark"] .btn.no { color: #0C1130; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ok, :root:not([data-theme="light"]) .btn.no { color: #0C1130; } }
.btn:disabled { opacity: .45; }
.btn svg { width: 20px; height: 20px; flex: none; }
.link { background: none; border: 0; padding: 6px 0; color: var(--cobalt); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.listen {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px;
  border-radius: 99px; border: 2px solid var(--cobalt-soft); background: var(--cobalt-soft); color: var(--cobalt); font-weight: 700; font-size: 15px;
}
.listen svg { width: 18px; height: 18px; }
.listen:disabled { opacity: .45; }
.listen.ping svg { animation: ping .6s ease; }
@keyframes ping { 40% { transform: scale(1.3); } }

/* ---------- home ---------- */
.today { display: flex; flex-direction: column; gap: 16px; }
.today .tiles { --t: 52px; gap: 10px; }
.today-words { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.today-words li { list-style: none; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.today-words b { font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.today-words span { color: var(--muted); font-size: 15px; grid-column: 1 / -1; }
.today-words { padding: 0; margin: 0; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; counter-reset: s; }
.steps li { list-style: none; font-size: 14px; color: var(--muted); line-height: 1.35; padding-top: 8px; border-top: 3px solid var(--tile); }
.steps li b { display: block; color: var(--ink); font-size: 15px; }
.steps { padding: 0; margin: 0; }
.notice { font-size: 15px; background: var(--cobalt-soft); color: var(--ink); padding: 10px 14px; border-radius: 10px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.stat { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .num { font-family: var(--font-display); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .lbl { font-size: 13px; color: var(--muted); }
.lvl { display: flex; flex-direction: column; gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.seg button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 7px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 700; font-size: 15px; }
.seg button.on { background: var(--cobalt); color: var(--cobalt-ink); box-shadow: 0 3px 0 var(--cobalt-deep); }
.seg.flat button { flex-direction: row; justify-content: center; padding: 9px 2px; font-size: 14px; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
.bars i { width: 4px; border-radius: 2px; background: currentColor; opacity: .25; }
.bars i.f { opacity: 1; }
.lvl-note { font-size: 15px; color: var(--muted); line-height: 1.45; }
.lvl-note b, .lvl-note em { color: var(--ink); }
.lvl-note em { font-family: var(--font-display); font-style: normal; }
.lvl-bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 6px; }
.lvl-bar i { display: block; height: 100%; background: var(--tile); border-radius: 99px; }

.week { display: flex; flex-direction: column; gap: 10px; }
.week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 700; }
.wd i { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; border: 2px dashed var(--line); font-style: normal; }
.wd.done i { background: var(--tile); border: 0; color: var(--tile-ink); box-shadow: 0 3px 0 var(--tile-edge); }
.wd.today i { border: 2px solid var(--cobalt); }
.wd.today.done i { border: 0; outline: 2px solid var(--cobalt); outline-offset: 2px; }
.wd svg { width: 18px; height: 18px; }

.more { display: flex; flex-direction: column; }
.row-btn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 4px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; }
.row-btn:last-child { border-bottom: 1px solid var(--line); }
.row-btn .ico { width: 42px; height: 42px; border-radius: 12px; background: var(--cobalt-soft); color: var(--cobalt); display: grid; place-items: center; flex: none; }
.row-btn .ico svg { width: 22px; height: 22px; }
.row-btn b { display: block; font-size: 17px; }
.row-btn small { color: var(--muted); font-size: 14px; }
.row-btn .chev { margin-left: auto; color: var(--muted); }
.row-btn:disabled { opacity: .5; }
.foot { font-size: 13px; color: var(--muted); }

/* ---------- lesson / quiz chrome ---------- */
.qtop { display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 14px 0 10px; }
.bar { flex: 1; height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--cobalt); border-radius: 99px; transition: width .35s ease; }
.segs { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.segs i { height: 12px; border-radius: 99px; background: var(--line); }
.segs i.on { background: var(--tile); }
.combo { font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 4px; min-width: 52px; justify-content: flex-end; font-variant-numeric: tabular-nums; }
.combo svg { width: 18px; height: 18px; }
.combo.hot { animation: bump .4s ease; }
@keyframes bump { 50% { transform: scale(1.25); } }

.learn { display: flex; flex-direction: column; gap: 22px; }
.meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pos { font-style: italic; color: var(--muted); font-size: 17px; }
.blk { display: flex; flex-direction: column; gap: 6px; }
.def { font-size: 22px; line-height: 1.4; max-width: 34ch; }
.ex { font-size: 19px; line-height: 1.5; padding-left: 14px; border-left: 4px solid var(--tile); }
mark { background: linear-gradient(transparent 58%, color-mix(in srgb, var(--tile) 75%, transparent) 58%); color: inherit; font-weight: 700; padding: 0 1px; }
.syn { display: flex; align-items: baseline; gap: 10px; font-size: 16px; color: var(--muted); }
.chip { display: inline-block; padding: 3px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); color: var(--ink); font-weight: 700; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: linear-gradient(transparent, var(--paper) 30%); padding: 26px 20px max(18px, env(safe-area-inset-bottom)); }
.dock-in { max-width: 520px; margin: 0 auto; display: flex; gap: 12px; }
.dock-in .btn.alt { width: auto; flex: 0 0 auto; padding: 12px 18px; }

.q { display: flex; flex-direction: column; gap: 20px; }
.q .h-l { font-size: 26px; }
.prompt-def { font-size: 23px; line-height: 1.4; font-family: var(--font-display); }
.prompt-sent { font-size: 22px; line-height: 1.55; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 3px solid var(--cobalt); color: transparent; line-height: 1.1; }
.blank.fill { color: var(--good); font-weight: 700; border-color: var(--good); min-width: 0; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  min-height: 58px; padding: 12px 14px; border-radius: var(--r);
  background: var(--card); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line);
  font-size: 17px; line-height: 1.35;
  transition: transform .08s, border-color .15s, background .15s;
}
.opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt .key { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--muted); }
.opt { scroll-margin: 90px 0 230px; }
.opt.w .txt { font-family: var(--font-display); font-size: 21px; }
.opt.right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 3px 0 var(--good); animation: bump .35s ease; }
.opt.right .key { border-color: var(--good); color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); animation: shake .4s ease; }
.opt.wrong .key { border-color: var(--bad); color: var(--bad); }
.opt.dim { opacity: .5; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.big-listen { width: 120px; height: 120px; border-radius: 28px; border: 0; background: var(--cobalt); color: var(--cobalt-ink); box-shadow: 0 6px 0 var(--cobalt-deep); display: grid; place-items: center; }
.big-listen svg { width: 52px; height: 52px; }
.big-listen:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--cobalt-deep); }
.listen-row { display: flex; align-items: center; gap: 18px; }
.listen-row p { color: var(--muted); font-size: 15px; max-width: 18ch; }

.slots { display: flex; flex-wrap: wrap; gap: 5px; }
.slot { --t: 40px; width: var(--t); height: calc(var(--t) * 1.1); border-radius: 8px; border: 2px dashed var(--line); background: transparent; padding: 0; display: grid; place-items: center; }
.slots.good .tile { background: var(--good); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--good) 65%, #000); }
.slots.bad { animation: shake .4s ease; }
.slots.bad .tile { background: var(--bad); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--bad) 65%, #000); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.bank button { padding: 0; border: 0; background: none; }
.bank .tile { --t: 46px; }
.bank button:disabled .tile { opacity: .18; box-shadow: none; }
.bank button:active:not(:disabled) .tile { transform: translateY(3px); box-shadow: 0 1px 0 var(--tile-edge); }
.spell-tools { display: flex; gap: 10px; align-items: center; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.mchip { padding: 8px 14px; border-radius: 10px; border: 2px solid var(--tile-edge); background: var(--tile); color: var(--tile-ink); font-weight: 700; font-size: 17px; box-shadow: 0 3px 0 var(--tile-edge); }
.mchip.sel { outline: 3px solid var(--cobalt); outline-offset: 2px; transform: translateY(-2px); }
.mchip.used { background: transparent; border-style: dashed; border-color: var(--line); color: var(--muted); box-shadow: none; text-decoration: line-through; }
.mchip.wrong, .mdef.wrong { animation: shake .4s ease; border-color: var(--bad); }
.mdefs { display: flex; flex-direction: column; gap: 8px; }
.mdef { text-align: left; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-size: 16px; line-height: 1.35; display: flex; flex-direction: column; gap: 4px; }
.mdef.done { border-color: var(--good); background: var(--good-soft); }
.mdef .tag { font-weight: 700; color: var(--good); font-size: 14px; }
.mdef:disabled { cursor: default; }

/* ---------- feedback sheet ---------- */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; padding: 18px 20px max(18px, env(safe-area-inset-bottom)); animation: up .25s ease both; border-top: 2px solid; }
.sheet.ok { background: var(--good-soft); border-color: var(--good); }
.sheet.no { background: var(--bad-soft); border-color: var(--bad); }
.sheet-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.verdict { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 25px; }
.ok .verdict { color: var(--good); }
.no .verdict { color: var(--bad); }
.verdict svg { width: 28px; height: 28px; flex: none; }
.verdict .gain { margin-left: auto; font-family: var(--font-body); font-weight: 700; font-size: 16px; }
.sheet-txt { font-size: 16px; line-height: 1.45; }
.sheet-txt b { font-size: 18px; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }

/* ---------- results ---------- */
.res { display: flex; flex-direction: column; gap: 22px; padding-top: 18px; }
.stars { display: flex; gap: 8px; }
.stars svg { width: 54px; height: 54px; }
.stars .on { color: var(--tile); filter: drop-shadow(0 3px 0 var(--tile-edge)); animation: starPop .5s cubic-bezier(.2,.9,.3,1.4) both; }
.stars .off { color: var(--line); }
.stars svg:nth-child(2) { animation-delay: .15s; }
.stars svg:nth-child(3) { animation-delay: .3s; }
@keyframes starPop { from { transform: scale(0) rotate(-30deg); } to { transform: none; } }
.res-stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.wl { padding: 0; margin: 0; display: flex; flex-direction: column; }
.wl li { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.wl li:first-child { border-top: 1px solid var(--line); }
.wl .w { font-family: var(--font-display); font-size: 20px; }
.wl .st { margin-left: auto; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.wl .st.y { color: var(--good); }
.wl .st.n { color: var(--bad); }
.wl .st svg { width: 18px; height: 18px; }
.btn-col { display: flex; flex-direction: column; gap: 12px; }

/* ---------- word book ---------- */
.book-head { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
.search { width: 100%; height: 50px; border-radius: var(--r); border: 2px solid var(--line); background: var(--card); color: var(--ink); padding: 0 16px; font: inherit; }
.search:focus { outline: none; border-color: var(--cobalt); }
.grp { display: flex; flex-direction: column; }
.grp h2 { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 0 8px; }
.entry { border-top: 1px solid var(--line); }
.grp .entry:last-child { border-bottom: 1px solid var(--line); }
.entry-h { display: flex; align-items: center; gap: 10px; }
.entry-h > button.open { flex: 1; display: flex; align-items: baseline; gap: 10px; background: none; border: 0; padding: 14px 0; text-align: left; min-width: 0; }
.entry-h .w { font-family: var(--font-display); font-size: 21px; }
.entry-h .p { font-style: italic; color: var(--muted); font-size: 15px; }
.dots { display: inline-flex; gap: 3px; margin-left: auto; padding-right: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 99px; background: var(--line); }
.dots i.on { background: var(--tile-edge); }
.entry-b { padding: 0 0 16px; display: flex; flex-direction: column; gap: 8px; }
.entry-b .ex { font-size: 16px; }
.empty { color: var(--muted); padding: 20px 0; }

/* ---------- dialog / fx ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 40, .5); display: grid; place-items: center; padding: 20px; animation: fade .15s ease; }
.dialog { background: var(--card); border-radius: 18px; padding: 22px; max-width: 380px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.dialog .row { display: flex; gap: 10px; margin-top: 6px; }
@keyframes fade { from { opacity: 0; } }
.toast { display: flex; align-items: center; gap: 14px; position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40; max-width: calc(100% - 32px); background: var(--ink); color: var(--paper); padding: 11px 16px; border-radius: 12px; font-size: 15px; font-weight: 700; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.toast-btn { background: none; border: 0; padding: 4px 2px; color: var(--tile); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 16px; border-radius: 99px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; font-size: 15px; }
.pill-btn svg { width: 18px; height: 18px; color: var(--cobalt); }
.pill-btn:disabled { opacity: .45; }
.today-words small { color: var(--muted); font-size: 14px; font-style: italic; align-self: center; }
.btn .spin { width: 18px; height: 18px; border-radius: 99px; border: 3px solid currentColor; border-right-color: transparent; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 380px) {
  .h-xl { font-size: 34px; }
  .today .tiles { --t: 46px; }
  .stat .num { font-size: 26px; }
  .def { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

    tiers.push([shuffle(pool.filter(w => okFam(BY.get(w)))), 3]);
    tiers.push([shuffle(WORDS.filter(x => x.lv === t.lv && okFam(x)).map(x => x.w)), n]);
    tiers.push([shuffle(WORDS.filter(okFam).map(x => x.w)), n]);

    tiers.push([shuffle(WORDS.filter(x => x.w[0] === t.w[0] && Math.abs(x.w.length - t.w.length) <= 3).map(x => x.w)), 2]);
    tiers.push([shuffle(pool), n]);
  } else {
    // Wrong answers come from the same level first, so a rare word is never paired with its everyday twin.
    tiers.push([shuffle(pool.filter(w => BY.get(w).p === t.p)), 2]);
    tiers.push([shuffle(WORDS.filter(x => x.lv === t.lv && x.p === t.p).map(x => x.w)), n]);
    tiers.push([shuffle(WORDS.filter(x => x.lv === t.lv).map(x => x.w)), n]);

  if (mode !== "blank") tiers.push([shuffle(WORDS.map(x => x.w)), n]);

}
function makeQ(type, id, pool) {

    if (j > 0) [qs[i], qs[j]] = [qs[j], qs[i]];

function buildQuiz(ids, kind) {
  const qs = [], voice = canSpeak();
  ids.forEach(id => {
    const idiom = BY.get(id).p === "idiom";
    if (kind === "review") {
      const types = ["meaning", "word"]; if (!idiom) types.push("blank"); if (voice) types.push("listen");
      qs.push(makeQ(pick(types), id, ids)); return;
    }

    qs.push(makeQ(first, id, ids));

        <div class="stat"><span class="num">${sk.n}</span><span class="lbl">day streak</span></div>
      </div>
      <ul class="wl">${s.ids.map(id => { const ok = s.res[id] !== false; return `<li><span class="w">${esc(id)}</span>${dots(mastery(id).m)}<span class="st ${ok ? "y" : "n"}">${ok ? ICON.check + "Got it" : ICON.loop + "Practise more"}</span></li>`; }).join("")}</ul>
      <div class="btn-col">
        ${s.kind === "lesson" ? `<button class="btn" data-act="refresh-home">${ICON.loop} Get 5 new words</button><button class="btn alt" data-act="quiz-again">Take the quiz again</button>` : ""}
        <button class="btn ${s.kind === "lesson" ? "alt" : ""}" data-act="home">Back home</button>
        <button class="link" data-act="book">Open my word book</button>
      </div>
    </section>
  </div>`;
}

function renderBook() {
  const today = dkey();
  const byDate = {};
  for (const set of state.sets) if (set.done && !set.review) { const k = set.doneAt || set.made || today; (byDate[k] = byDate[k] || []).push(...set.ids); }
  const groups = Object.keys(byDate).sort().reverse();
  const seen = new Set(); const q = bookQuery.trim().toLowerCase();
  let count = 0;
  const html = groups.map(k => {
    const ids = byDate[k];
    const items = ids.filter(id => BY.has(id) && !seen.has(id) && (seen.add(id), true)).filter(id => (bookLevel === "all" || BY.get(id).lv === bookLevel) && (!q || id.includes(q) || BY.get(id).d.toLowerCase().includes(q)));
    if (!items.length) return "";
    count += items.length;
    return `<div class="grp"><h2>${k === today ? "Today" : esc(fmtDay(k, { weekday: "short", month: "short", day: "numeric" }))}</h2>${items.map(id => {
      const x = BY.get(id), open = bookOpen === id;
      return `<div class="entry"><div class="entry-h"><button class="open" data-act="bopen" data-id="${esc(id)}" aria-expanded="${open}"><span class="w">${esc(x.w)}</span><span class="p">${esc(x.p)} · ${esc(LV[x.lv].name)}</span>${dots(mastery(id).m)}</button>${canSpeak() ? `<button class="icon-btn" data-act="say" data-say="${esc(x.w)}" aria-label="Hear ${esc(x.w)}">${ICON.sound}</button>` : ""}</div>
        ${open ? `<div class="entry-b"><p>${esc(x.d)}</p><p class="ex">${exampleHTML(x)}</p>${x.s ? `<p class="syn">Similar to <span class="chip">${esc(x.s)}</span></p>` : ""}</div>` : ""}</div>`;
    }).join("")}</div>`;
  }).join("");
  const total = learnedIds().size;
  app.innerHTML = `<div class="wrap" style="gap:20px">
    <div class="book-head"><button class="icon-btn" data-act="home" aria-label="Back home">${ICON.back}</button><h1 class="h-l">My word book</h1></div>
    ${total ? `<label class="sr" for="bq">Search your words</label><input id="bq" class="search" type="search" placeholder="Search ${total} words" value="${esc(bookQuery)}" autocomplete="off">
    <div class="seg flat" role="radiogroup" aria-label="Show words from">${["all", ...LV_KEYS].map(k => `<button role="radio" aria-checked="${bookLevel === k}" class="${bookLevel === k ? "on" : ""}" data-act="bfilter" data-lv="${k}">${k === "all" ? "All" : LV[k].name}</button>`).join("")}</div>` : ""}
    ${html || `<p class="empty">${total ? "No words match." : "Finish today's lesson and your words will appear here, ready to review."}</p>`}
    ${total ? `<p class="foot">The dots show how well you know each word. Answer a word correctly to fill a dot.</p><button class="btn alt" data-act="report">${ICON.down} Download a review report</button>` : ""}
  </div>`;
  const inp = $("#bq");
  if (inp) inp.addEventListener("input", () => { bookQuery = inp.value; const pos = inp.selectionStart; renderBook(); const n = $("#bq"); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} });
}

/* ================= quiz logic ================= */
function grade(correct) {
  const s = session, q = s.queue[s.qi], c = s.cur;
  c.state = "done"; c.correct = correct;
  if (!q.retry) {
    s.stats.total++;
    if (correct) s.stats.correct++;
    const m = state.mastery[q.id] || { m: 0, c: 0, x: 0, t: 0 };
    state.mastery[q.id] = correct ? { m: Math.min(5, m.m + 1), c: m.c + 1, x: m.x, t: Date.now() } : { m: Math.max(0, m.m - 1), c: m.c, x: m.x + 1, t: Date.now() };
    if (!correct) s.res[q.id] = false;
  }
  if (correct) {
    s.stats.combo++; s.stats.best = Math.max(s.stats.best, s.stats.combo);
    c.gain = q.retry ? 5 : 10 + (s.stats.combo >= 3 ? 5 : 0);
    s.stats.xp += c.gain; c.praise = pick(PRAISE);
    SFX.good();
  } else {
    s.stats.combo = 0; c.gain = 0;
    if (!q.retry) { const again = makeQ(q.type, q.id, s.ids); again.retry = true; s.queue.push(again); }
    SFX.bad();
  }
  if (navigator.vibrate && !correct) try { navigator.vibrate(60); } catch (e) {}
  render();
}
function nextQ() {
  const s = session;
  if (s.qi + 1 >= s.queue.length) return finish();
  s.qi++; s.cur = newCur(); render(); scrollTo(0, 0);
}
function finish() {
  const s = session, today = dkey();
  if (s.kind === "lesson") {
    const d = setById(s.setId);
    const acc = s.stats.total ? s.stats.correct / s.stats.total : 1;
    if (!d) { /* the set no longer exists */ }
    else if (!d.done) { d.done = true; d.doneAt = today; d.best = s.stats.correct; d.total = s.stats.total; if (acc === 1) s.stats.xp += 20; }
    else if (s.stats.correct > d.best) { d.best = s.stats.correct; d.total = s.stats.total; }
  }
  state.xp[today] = (state.xp[today] || 0) + s.stats.xp;
  persist();
  s.phase = "results"; render(); scrollTo(0, 0);
  SFX.win(); setTimeout(confetti, 120);
}

/* ================= events ================= */
function closeDialog() { dialog = null; const d = $(".scrim"); if (d) d.remove(); }
function goHome() { stopFx(); session = null; view = "home"; closeDialog(); ensureCurrent(); render(); scrollTo(0, 0); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act, s = session;
  switch (act) {
    case "sound": prefs.sound = !prefs.sound; savePrefs(); render(); if (prefs.sound) SFX.tap(); break;
    case "say": speak(b.dataset.say, b); break;
    case "start": startCurrent(); break;
    case "refresh": refreshWords(); break;
    case "refresh-home": goHome(); refreshWords(); break;
    case "undo": document.querySelectorAll(".toast").forEach(t => t.remove()); if (!session) undoWords(); break;
    case "level": setLevel(b.dataset.lv); break;
    case "source": setSource(b.dataset.src); break;
    case "bfilter": bookLevel = b.dataset.lv; renderBook(); break;
    case "report":
      dialog = `<div class="scrim" data-act="dlg-stay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" data-act="noop"><h2 id="dlg-t" class="h-l" style="font-size:24px">Download your report</h2><p class="sub">It lists every word you've learned, with its meaning, example and how well you know it. Words to practise come first.</p><div class="btn-col"><button class="btn" data-act="rep-html">Review report (.html)</button><button class="btn alt" data-act="rep-csv">Spreadsheet (.csv)</button><button class="link" data-act="dlg-stay">Cancel</button></div></div></div>`;
      app.insertAdjacentHTML("beforeend", dialog);
      { const k = document.querySelector(".dialog .btn"); if (k) k.focus(); }
      break;
    case "rep-html": downloadReport("html"); break;
    case "rep-csv": downloadReport("csv"); break;
    case "relearn": { const c = curSet(); if (c && !c.pending) startSession("lesson", c.ids.slice(), "learn", c.id); break; }
    case "quiz-again": { const c = s ? setById(s.setId) : curSet(); if (c && !c.pending) { stopFx(); startSession("lesson", c.ids.slice(), "quiz", c.id); } break; }
    case "review": startSession("review", weakest([...learnedIds()], 5), "quiz"); break;
    case "book": stopFx(); session = null; view = "book"; bookOpen = null; render(); scrollTo(0, 0); break;
    case "home": goHome(); break;
    case "bopen": bookOpen = bookOpen === b.dataset.id ? null : b.dataset.id; renderBook(); break;
    case "prev": if (s && s.li > 0) { s.li--; s.learnAnim = true; render(); scrollTo(0, 0); } break;
    case "next-word":
      if (!s) break;
      SFX.tap();
      if (s.li < s.ids.length - 1) { s.li++; s.learnAnim = true; render(); scrollTo(0, 0); }
      else {
        if (s.kind === "lesson") { const d = setById(s.setId); if (d && !d.learned) { d.learned = true; persist(); } }
        s.phase = "quiz"; s.queue = buildQuiz(s.ids, s.kind); s.qi = 0; s.cur = newCur(); render(); scrollTo(0, 0);
      }
      break;
    case "quit":
      if (s && s.phase === "quiz" && s.qi > 0) {
        dialog = `<div class="scrim" data-act="dlg-stay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" data-act="noop"><h2 id="dlg-t" class="h-l" style="font-size:24px">Leave the quiz?</h2><p class="sub">Your answers in this round won't count. You can start the quiz again from the home screen.</p><div class="row"><button class="btn" data-act="dlg-stay">Keep playing</button><button class="btn alt" data-act="home">Leave</button></div></div></div>`;
        app.insertAdjacentHTML("beforeend", dialog);
        const k = document.querySelector(".dialog .btn"); if (k) k.focus();
      } else goHome();
      break;
    case "dlg-stay": closeDialog(); break;
    case "noop": break;
    case "pick": {
      if (!s || s.cur.state !== "ask") break;
      const q = s.queue[s.qi], i = +b.dataset.i;
      s.cur.picked = i; grade(q.options[i] === q.id); break;
    }
    case "spell": {
      if (!s || s.cur.state !== "ask") break;
      const q = s.queue[s.qi], i = +b.dataset.i;
      if (s.cur.spelled.includes(i)) break;
      s.cur.spelled.push(i); SFX.tap();
      if (s.cur.spelled.length === q.id.length) grade(s.cur.spelled.map(k => q.letters[k]).join("") === q.id);
      else render();
      break;
    }
    case "unspell": if (s && s.cur.state === "ask") { s.cur.spelled.splice(+b.dataset.k, 1); render(); } break;
    case "clear": if (s && s.cur.state === "ask") { s.cur.spelled = []; render(); } break;
    case "msel": if (s && s.cur.state === "ask") { s.cur.sel = s.cur.sel === b.dataset.id ? null : b.dataset.id; SFX.tap(); render(); } break;
    case "mdef": {
      if (!s || s.cur.state !== "ask") break;
      const c = s.cur, q = s.queue[s.qi], id = b.dataset.id;
      if (!c.sel) { b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); break; }
      if (c.sel === id) {
        c.matched.push(id); c.sel = null; SFX.match();
        if (c.matched.length === q.ids.length) {
          const right = q.ids.length - c.missed.length;
          s.stats.total += q.ids.length; s.stats.correct += right;
          c.gain = right * 5; s.stats.xp += c.gain;
          c.missed.forEach(m => { s.res[m] = false; });
          c.state = "done"; c.correct = true; SFX.good();
        }
      } else {
        if (!c.missed.includes(c.sel)) c.missed.push(c.sel);
        c.wrong = [c.sel, id]; c.sel = null; s.stats.combo = 0; SFX.bad();
      }
      render(); break;
    }
    case "next-q": nextQ(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.key === "Escape" && dialog) { closeDialog(); return; }
  const s = session; if (!s || dialog) return;
  if (s.phase === "learn") {
    if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); $('[data-act="next-word"]').click(); }
    if (e.key === "ArrowLeft") { const p = $('[data-act="prev"]'); if (p) p.click(); }
    return;
  }
  if (s.phase !== "quiz") return;
  const q = s.queue[s.qi], c = s.cur;
  if (c.state === "done" && e.key === "Enter") { e.preventDefault(); nextQ(); return; }
  if (c.state !== "ask") return;
  if (q.options && /^[1-4]$/.test(e.key)) { const btn = $(`[data-act="pick"][data-i="${+e.key - 1}"]`); if (btn) btn.click(); }
  if (q.type === "spell") {
    if (e.key === "Backspace" && c.spelled.length) { c.spelled.pop(); render(); e.preventDefault(); return; }
    if (/^[a-z]$/i.test(e.key)) {
      const i = q.letters.findIndex((ch, k) => ch === e.key.toLowerCase() && !c.spelled.includes(k));
      if (i >= 0) { const btn = $(`[data-act="spell"][data-i="${i}"]`); if (btn) btn.click(); }
    }
  }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && !session && !busy) { ensureCurrent(); if (view === "home") render(); } });
setInterval(() => { if (session || busy || view !== "home") return; const c = curSet(); if (!c || (c.done && c.doneAt && c.doneAt < dkey())) { ensureCurrent(); render(); } }, 30000);

/* ================= boot ================= */
function start(data) {
  if (data && data.session && data.session.phase) { session = data.session; view = data.view || "home"; }
  else if (data && data.view) view = data.view;
  initVoice();
  render();
  initCloud();
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => JSON.parse(JSON.stringify({ session, view }))); } catch (e) {}
(window.claude && window.claude.hot && window.claude.hot.ready) ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
</body>
